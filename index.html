<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabela dos Craques</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0e3b2c;--g2:#165a42;--c:#f3f1e7;--y:#ffd23f;--r:#e4572e;--l:rgba(243,241,231,.22)}
*{box-sizing:border-box;margin:0}
body{font:16px Barlow,system-ui,sans-serif;background:var(--g);color:var(--c);min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.02em}
h1{font-size:44px;line-height:1}h2{font-size:26px;margin:14px 0 8px}h3{font-size:20px;margin:18px 0 6px;color:var(--y)}
.wrap{max-width:640px;margin:0 auto;padding:14px 0 40px}
.home{min-height:90vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.pitch{border:2px solid var(--l);border-radius:14px;padding:22px 18px;position:relative}
.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--l)}
.pitch h1{position:relative;background:var(--g);display:inline-block;padding:0 10px}
button,.btn{font:600 16px Barlow,sans-serif;border:2px solid var(--c);background:transparent;color:var(--c);border-radius:10px;padding:12px 14px;cursor:pointer}
button:active{transform:scale(.98)}button:focus-visible,input:focus-visible{outline:3px solid var(--y)}
.big{width:100%;text-align:left;font-size:20px;padding:18px;background:var(--g2)}
.big small{display:block;font-weight:400;opacity:.75;font-size:14px}
.pri{background:var(--y);color:#10281f;border-color:var(--y)}
.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input{font:inherit;background:rgba(0,0,0,.25);border:1px solid var(--l);color:var(--c);border-radius:8px;padding:8px;min-width:0}
table{width:100%;border-collapse:collapse}
th{font-size:13px;text-align:center;color:var(--y);padding:6px 2px}
td{padding:4px 2px;border-top:1px solid var(--l);text-align:center}
td input{width:100%;text-align:center;padding:6px 2px}
td.n input{text-align:left;min-width:90px}
td.pos{width:26px;font-family:Anton;color:var(--y)}
.scroll{overflow-x:auto}
.mv{display:flex;flex-direction:column;gap:2px}.mv button{padding:0 6px;font-size:11px;line-height:16px;border-radius:4px}
.card{border:1px solid var(--l);border-radius:10px;padding:12px;margin:8px 0;background:var(--g2)}
.code{font:700 26px Anton;letter-spacing:.2em;color:var(--y)}
#toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 8px);background:var(--y);color:#10281f;padding:12px;border-radius:10px;font-weight:600;display:none;z-index:9}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal>div{background:var(--g2);border:2px solid var(--y);border-radius:14px;padding:20px;max-width:380px}
.photo{background:#fff;color:#111;padding:18px;border-radius:6px}
.photo th{color:#111}.photo td{border-color:#bbb}.photo td input,.photo td span{color:#111}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.grid{min-width:700px}
.tr{display:grid;grid-template-columns:44px minmax(190px,1fr) 46px 42px 48px 48px 48px 48px 48px 48px 128px;align-items:center;gap:2px;padding:10px;border-bottom:1px solid var(--line);background:var(--card);text-align:center}
.tr:last-child{border:0}.tr.head{color:var(--mute);font-size:14px;background:none}.tr.first{box-shadow:inset 4px 0 0 var(--y)}
.pos{display:flex;flex-direction:column;align-items:center;font-weight:600}
.mvb{display:flex;gap:2px}.mvb button{padding:0 5px;font-size:10px;line-height:15px;border-radius:4px;color:var(--ink);border-color:var(--line)}
.club{display:flex;align-items:center;gap:10px;text-align:left}.club img{width:34px;height:36px}
.club input{flex:1;min-width:0;background:none;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 2px;color:var(--ink)}
.st{display:contents}.lb{display:none}
.num{width:40px;text-align:center;padding:5px 0;color:var(--ink)}
.pts{font:700 22px Anton,sans-serif}
.last{display:flex;gap:4px;justify-content:center}
.dot{width:19px;height:19px;border-radius:50%;border:0;padding:0;font-size:10px;font-weight:700;color:#fff;background:var(--line)}
.dot.V{background:#2e9e5b}.dot.E{background:#98a19b}.dot.D{background:#d04a3c}
select{font:inherit;background:rgba(0,0,0,.25);color:var(--c);border:1px solid var(--l);border-radius:8px;padding:8px;flex:1 1 120px;min-width:0}
.photo{--card:#fff;--ink:#111;--mute:#555;--line:#ccc}
@media(max-width:760px){.tw{background:none;border:0;overflow:visible}.grid{min-width:0;display:grid;gap:10px}.tr.head{display:none}
.tr{border:1px solid var(--line);border-radius:12px;row-gap:8px;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-areas:"pos club club club club club pts" "pj v e d gp gc sg" "last last last last last last last"}
.tr>.pos{grid-area:pos}.tr>.club{grid-area:club}.tr>.last{grid-area:last}.st-pts{grid-area:pts}.st-pj{grid-area:pj}.st-v{grid-area:v}.st-e{grid-area:e}.st-d{grid-area:d}.st-gp{grid-area:gp}.st-gc{grid-area:gc}.st-sg{grid-area:sg}
.st{display:flex;flex-direction:column;align-items:center;gap:2px}.lb{display:block;font-size:12px;color:var(--mute)}.num{width:100%;max-width:52px;padding:8px 0}.dot{width:28px;height:28px;font-size:12px}.last{gap:8px}}
:root{--card:#16231b;--ink:#f3f1e7;--mute:#9bb0a4;--line:rgba(243,241,231,.22)}
.hide{display:none!important}
@media print{body{background:#fff}.noprint{display:none!important}.photo{padding:0}}
@media(prefers-reduced-motion:no-preference){button{transition:transform .1s}}
</style></head><body>
<div id="toast" role="status"></div>
<div id="modal"><div id="mbox"></div></div>
<div class="wrap" id="app"></div>
<input type="file" id="file" accept=".json" class="hide">
<script>
const VERSION='1.0.0';
const DB_URL='';        // Ex.: 'https://SEU-PROJETO-default-rtdb.firebaseio.com' (necessário para tabela ao vivo)
const UPDATE_URL='versao.json'; // arquivo versao.json ao lado do index.html
let S={tables:[]},tab='t',cur=null,view='home',poll=null,photoNames=true,bar=true;
try{S=JSON.parse(localStorage.getItem('craques')||'{"tables":[]}')}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const rid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
function save(){const j=JSON.stringify(S);localStorage.setItem('craques',j);localStorage.setItem('craques_bk',JSON.stringify({d:Date.now(),j}));if(cur&&cur.owner&&DB_URL)push(cur)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3500)}
function notify(t,b){toast(t+(b?' — '+b:''));try{if('Notification'in window&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}
function ask(html,btns){$('#mbox').innerHTML=html+'<div class="row">'+btns.map((b,i)=>`<button class="${i?'':'pri'}" data-i="${i}">${b[0]}</button>`).join('')+'</div>';$('#modal').style.display='flex';$('#mbox').querySelectorAll('button').forEach(x=>x.onclick=()=>{$('#modal').style.display='none';btns[x.dataset.i][1]()})}
const pts=t=>t.v*3+t.e,sg=t=>t.gp-t.gc;
function sorted(T){const a=T.teams.map((x,i)=>({...x,i}));if(T.auto)a.sort((x,y)=>pts(y)-pts(x)||sg(y)-sg(x)||y.gp-x.gp);return a}
function sortedP(T){const a=T.players.map((x,i)=>({...x,i}));if(T.auto)a.sort((x,y)=>y.g-x.g||y.h-x.h||x.j-y.j);return a}
function newTable(){ask('<h3>Nome da tabela</h3><input id="nt" value="Meu campeonato" onfocus="this.select()" style="width:100%">',[['Criar',()=>mk($('#nt').value.trim()||'Minha tabela')],['Cancelar',()=>{}]])}
function mk(n){
 const T={id:rid(),name:n,auto:true,owner:true,teams:[],players:[]};
 for(let i=1;i<=4;i++)T.teams.push({n:'Coloque o nome do time aqui',v:0,e:0,d:0,gp:0,gc:0,h:[]});
 for(let i=1;i<=4;i++)T.players.push({n:'Coloque o nome do jogador aqui',j:0,g:0,h:0});
 S.tables.push(T);cur=T;save();go('edit')}
function go(v){view=v;clearInterval(poll);render();window.scrollTo(0,0)}
function head(t,back='home'){return `<div class="row noprint"><button class="sm" onclick="go('${back}')">‹ Voltar</button></div><h2>${t}</h2>`}
const bdg=(n,i)=>{const t=n.split(/[\s&]+/).filter(Boolean).map(w=>w[0]).join('').replace(/[^\p{L}\p{N}]/gu,'').slice(0,3).toUpperCase()||'?',h=[150,215,0,270,40,195][i%6];return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 104'><path d='M50 3 93 15v37c0 25-20 41-43 48C27 93 7 77 7 52V15z' fill='hsl(${h} 45% 30%)' stroke='hsl(${h} 30% 80%)' stroke-width='4'/><text x='50' y='64' font-size='${t.length>2?27:34}' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'>${t}</text></svg>`)};
function teamsTable(T,ro,hideN){const L={v:'VIT',e:'E',d:'DER',gp:'GM',gc:'GC'};
 return `<div class="tw"><div class="grid"><div class="tr head"><span>#</span><span style="text-align:left">Time</span><span>Pts</span><span>PJ</span><span>VIT</span><span>E</span><span>DER</span><span>GM</span><span>GC</span><span>SG</span><span>Últimas 5</span></div>`+
 sorted(T).map((t,k)=>{const sh=(t.h||[]).slice(-5),d=sg(t);
 return `<div class="tr${k?'':' first'}"><div class="pos"><b>${k+1}</b>${ro?'':`<span class="mvb"><button onclick="mv('teams',${t.i},-1)">▲</button><button onclick="mv('teams',${t.i},1)">▼</button></span>`}</div>
 <div class="club"><img src="${bdg(t.n,t.i)}" alt="">${ro?`<span>${hideN?'—':esc(t.n)}</span>`:`<input value="${esc(t.n)}" onfocus="this.select()" onchange="ed('teams',${t.i},'n',this.value)">`}</div>
 <div class="st st-pts"><span class="lb">Pts</span><strong class="pts">${pts(t)}</strong></div>
 <div class="st st-pj"><span class="lb">PJ</span><b>${t.v+t.e+t.d}</b></div>`+
 ['v','e','d','gp','gc'].map(f=>`<div class="st st-${f}"><span class="lb">${L[f]}</span>${ro?`<span>${t[f]}</span>`:`<input class="num" type="number" min="0" inputmode="numeric" value="${t[f]}" onchange="ed('teams',${t.i},'${f}',+this.value)">`}</div>`).join('')+
 `<div class="st st-sg"><span class="lb">SG</span><b>${d>0?'+':''}${d}</b></div><div class="last">${[0,1,2,3,4].map(i=>`<button class="dot ${sh[i]||''}" ${ro?'disabled':`onclick="dot(${t.i},${i})"`}>${sh[i]||''}</button>`).join('')}</div></div>`}).join('')+'</div></div>'}
function dot(i,k){const t=cur.teams[i],h=t.h=t.h||[],sh=h.slice(-5),o=h.length-sh.length;if(k<sh.length){const x=o+k,n={V:'E',E:'D',D:null}[h[x]];n?h[x]=n:h.splice(x,1)}else h.push('V');save();render()}
function panel(T){const o=T.teams.map((t,i)=>`<option value="${i}">${esc(t.n)}</option>`).join('');return `<div class="card"><h3 style="margin:0 0 8px">Registrar jogo</h3><div class="row"><select id="sa">${o}</select><input id="ga" type="number" min="0" value="0" style="width:56px"><span>x</span><input id="gb" type="number" min="0" value="0" style="width:56px"><select id="sb">${o}</select></div><button class="pri" onclick="reg()">Registrar jogo</button></div>`}
function reg(){const a=+$('#sa').value,b=+$('#sb').value,ga=+$('#ga').value||0,gb=+$('#gb').value||0;if(a===b)return toast('Escolha dois times diferentes');
 const A=cur.teams[a],B=cur.teams[b];A.gp+=ga;A.gc+=gb;B.gp+=gb;B.gc+=ga;const r=ga>gb?['v','d','V','D']:ga<gb?['d','v','D','V']:['e','e','E','E'];
 A[r[0]]++;B[r[1]]++;(A.h=A.h||[]).push(r[2]);(B.h=B.h||[]).push(r[3]);save();notify('Jogo registrado',`${A.n} ${ga} x ${gb} ${B.n}`);render()}
function playersTable(T,ro,hideN){return `<div class="scroll"><table><tr><th>#</th><th style="text-align:left">Jogador</th><th>Gols</th><th>Jogos</th><th>Hat-trick</th>${ro?'':'<th></th>'}</tr>`+
 sortedP(T).map((p,k)=>`<tr><td class="pos">${k+1}</td><td class="n">${ro?`<span>${hideN?'—':esc(p.n)}</span>`:`<input value="${esc(p.n)}" onfocus="this.select()" onchange="ed('players',${p.i},'n',this.value)">`}</td>`+
 ['g','j','h'].map(f=>`<td>${ro?p[f]:`<input type="number" min="0" inputmode="numeric" value="${p[f]}" onchange="ed('players',${p.i},'${f}',+this.value)">`}</td>`).join('')+
 (ro?'':`<td><div class="mv"><button onclick="mv('players',${p.i},-1)">▲</button><button onclick="mv('players',${p.i},1)">▼</button></div></td>`)+'</tr>').join('')+'</table></div>'}
function ed(k,i,f,v){cur[k][i][f]=v;save();if(f!=='n')render()}
function mv(k,i,d){const a=cur[k],j=i+d;if(j<0||j>=a.length)return;
 if(cur.auto){cur.auto=false;const o=(k==='teams'?sorted(cur):sortedP(cur)).map(x=>x.i);cur[k]=o.map(n=>a[n]);i=o.indexOf(i);j=i+d;if(j<0||j>=a.length){save();return render()}}
 [a[i],a[j]]=[a[j],a[i]];save();render()}
function add(k){cur[k].push(k==='teams'?{n:'Coloque o nome do time aqui',v:0,e:0,d:0,gp:0,gc:0,h:[]}:{n:'Coloque o nome do jogador aqui',j:0,g:0,h:0});save();render()}
function sw(){return cur.auto=!cur.auto,save(),render()}
async function push(T){try{await fetch(`${DB_URL}/tabelas/${T.id}.json`,{method:'PUT',body:JSON.stringify({...T,owner:false,t:Date.now()})})}catch(e){}}
async function share(){
 let code=cur.id;
 if(DB_URL){await push(cur);notify('Tabela compartilhada','Código '+code)}
 else{code='T'+btoa(unescape(encodeURIComponent(JSON.stringify({...cur,owner:false}))));toast('Sem servidor: código com os dados atuais')}
 const txt=`Tabela dos Craques — ${cur.name}\nCódigo: ${code}`;
 try{navigator.share?await navigator.share({text:txt}):(await navigator.clipboard.writeText(txt),toast('Código copiado'))}catch(e){}}
async function join(){
 const c=$('#cod').value.trim();if(!c)return;let T;
 try{if(c[0]==='T'&&c.length>10)T=JSON.parse(decodeURIComponent(escape(atob(c.slice(1)))));
 else{if(!DB_URL)return toast('Servidor ao vivo não configurado');T=await(await fetch(`${DB_URL}/tabelas/${c.toUpperCase()}.json`)).json()}}catch(e){}
 if(!T||!T.teams)return toast('Código inválido ou tabela não encontrada');
 T.owner=false;T.live=true;const i=S.tables.findIndex(x=>x.id===T.id);i>=0?S.tables[i]=T:S.tables.push(T);cur=T;save();go('live')}
function startPoll(){if(!DB_URL)return;let last=cur.t||0;poll=setInterval(async()=>{try{const T=await(await fetch(`${DB_URL}/tabelas/${cur.id}.json`)).json();
 if(T&&T.t>last){last=T.t;T.owner=false;T.live=true;S.tables[S.tables.findIndex(x=>x.id===T.id)]=T;cur=T;save();notify('Tabela atualizada',T.name);render()}}catch(e){}},5000)}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-craques-'+new Date().toISOString().slice(0,10)+'.json';a.click();notify('Backup salvo','arquivo baixado')}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tables)throw 0;S=d;save();notify('Backup restaurado',S.tables.length+' tabela(s)');go('settings')}catch(x){toast('Arquivo de backup inválido')}};r.readAsText(f);e.target.value=''};
function restoreAuto(){const b=JSON.parse(localStorage.getItem('craques_bk')||'null');if(!b)return toast('Nenhum backup automático');
 ask(`<h3>Restaurar backup automático?</h3><p>Salvo em ${new Date(b.d).toLocaleString('pt-BR')}</p>`,[['Restaurar',()=>{S=JSON.parse(b.j);localStorage.setItem('craques',b.j);notify('Backup restaurado');go('settings')}],['Cancelar',()=>{}]])}
function open_(id){cur=S.tables.find(t=>t.id===id);go(cur.live?'live':'edit')}
function del(id){ask('<h3>Apagar esta tabela?</h3>',[['Apagar',()=>{S.tables=S.tables.filter(t=>t.id!==id);save();go('settings')}],['Cancelar',()=>{}]])}
async function perm(){if(!('Notification'in window))return toast('Notificações não suportadas aqui');const r=await Notification.requestPermission();toast(r==='granted'?'Notificações ativadas':'Notificações bloqueadas')}
async function checkUpdate(manual){if(!UPDATE_URL)return manual&&toast('Endereço de atualização não configurado');
 try{const d=await(await fetch(UPDATE_URL+'?'+Date.now())).json();
 if(d.version&&d.version!==VERSION){notify('Atualização disponível','versão '+d.version);ask(`<h3>Nova versão ${esc(d.version)}</h3><p>${esc(d.notas||'')}</p>`,[['Atualizar agora',()=>location.href=d.url],['Agora não',()=>{}]])}
 else manual&&toast('Você já usa a versão mais recente')}catch(e){manual&&toast('Não foi possível verificar')}}
function render(){const A=$('#app');
 if(view==='home')A.innerHTML=`<div class="home"><div class="pitch"><h1>TABELA<br>DOS CRAQUES</h1></div>
 <button class="big pri" onclick="newTable()">Criar tabela<small>Times e artilharia, em pontos corridos</small></button>
 <button class="big" onclick="go('join')">Entrar em uma planilha<small>Use o código que você recebeu</small></button>
 <button class="big" onclick="go('settings')">Configuração<small>Suas tabelas, backup, modo foto</small></button></div>`;
 else if(view==='edit'||view==='live'){const T=cur,ro=view==='live';A.innerHTML=head(esc(T.name))+`<div class="row"><button class="sm ${tab==='t'?'pri':''}" onclick="tab='t';render()">Times</button><button class="sm ${tab==='p'?'pri':''}" onclick="tab='p';render()">Jogadores</button></div><div class="row">${ro?'<span style="opacity:.8">'+(DB_URL?'Ao vivo — atualiza sozinho':'Cópia da tabela recebida')+'</span>':'<button class="sm pri" onclick="share()">Compartilhar</button><button class="sm" onclick="sw()">Ordem: '+(T.auto?'automática':'manual')+'</button>'}<button class="sm" onclick="go('photo')">Modo foto</button></div>`+
 (tab==='t'?(ro?'':panel(T))+teamsTable(T,ro)+(ro?'':'<div class="row"><button class="sm" onclick="add(\'teams\')">+ Time</button></div>'):'<h3>Artilharia dos jogadores</h3>'+playersTable(T,ro)+(ro?'':'<div class="row"><button class="sm" onclick="add(\'players\')">+ Jogador</button></div>'))+
 (ro?'':'<p style="opacity:.7;font-size:14px">Pts: vitória 3, empate 1. Toque nas bolinhas para mudar os últimos resultados. Use ▲▼ para mover.</p>');
 if($('#sb'))$('#sb').selectedIndex=Math.min(1,T.teams.length-1);if(ro)startPoll()}
 else if(view==='join')A.innerHTML=head('Entrar em uma planilha')+`<div class="card"><p>Digite o código que te enviaram.</p><div class="row"><input id="cod" placeholder="Código" autocapitalize="characters" style="flex:1"><button class="pri" onclick="join()">Entrar</button></div></div>`;
 else if(view==='settings')A.innerHTML=head('Configuração')+`<h3>Suas tabelas</h3>`+(S.tables.length?S.tables.map(t=>`<div class="card"><b>${esc(t.name)}</b> <span style="opacity:.7">${t.live?'recebida':'sua · código '+t.id}</span><div class="row"><button class="sm" onclick="open_('${t.id}')">Abrir</button><button class="sm" onclick="cur=S.tables.find(x=>x.id==='${t.id}');go('photo')">Foto</button><button class="sm" onclick="del('${t.id}')">Apagar</button></div></div>`).join(''):'<p>Nenhuma tabela ainda.</p>')+
 `<h3>Backup</h3><div class="row"><button class="sm" onclick="backup()">Salvar backup</button><button class="sm" onclick="$('#file').click()">Importar backup</button><button class="sm" onclick="restoreAuto()">Último automático</button></div>
 <h3>Avisos e versão</h3><div class="row"><button class="sm" onclick="perm()">Ativar notificações</button><button class="sm" onclick="checkUpdate(1)">Buscar atualização</button></div><p style="opacity:.7">Versão ${VERSION}</p>`;
 else if(view==='photo'){const T=cur,o=T.live;A.innerHTML=`<div class="noprint ${bar?'':'hide'}" id="bar"><button class="sm" onclick="go('${o?'live':'edit'}')">‹ Voltar</button>
 <div class="row"><button class="sm" onclick="photoNames=!photoNames;render()">Nomes: ${photoNames?'visíveis':'ocultos'}</button><button class="sm pri" onclick="bar=false;render();toast('Toque na tela para voltar os botões')">Esconder botões</button><button class="sm" onclick="print()">Imprimir</button></div></div>
